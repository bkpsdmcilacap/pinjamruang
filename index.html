<!DOCTYPE html>
<html lang="id">

      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

    allowfullscreen>
  </iframe>

  <script>
    /**
     * Trik untuk memaksa link yang dibuka di dalam iframe 
     * agar tetap terbuka di dalam iframe ini juga, bukan pindah tab.
     */
    const iframe = document.getElementById('appFrame');

    // Kita pantau perubahan URL di dalam iframe
    // Catatan: Karena batasan Cross-Origin, browser mungkin membatasi deteksi otomatis.
    // Namun, penamaan name="mainFrame" di atas adalah cara standar HTML 
    // agar link dengan target="mainFrame" atau target="_self" tetap di dalam bingkai.
  </script>

</body>
</html>
